<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>[개발 확인용] 공통 UI · 파셜 · 목록 샘플</title>
		<link rel="stylesheet" href="/css/common.css" />
		<script src="/js/dynamicImport.js"></script>
		<script src="/js/listRender.js"></script>
		<script src="/js/common.js"></script>
		<!-- 날짜 · 기간 달력용 -->
		<script src="/js/jquery-3.7.1.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
	</head>

	<body>

		<div
			class="dynamic-content"
			data-source="/html/include/sample/_sample_layout.html"
			data-page-title="공통 UI 샘플"
			data-slot-main="#sample_main"
		></div>

		<!-- 본문 — 틀(_sample_layout)의 main 슬롯에 들어간다 -->
		<template id="sample_main">
			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_list.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_button.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_input.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_dropdown.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_checkbox.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_radio.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_toggle.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_tooltip.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_tab.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_accordion.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_toast.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_modal.html"></div>

			<div class="dynamic-content" data-source="/html/include/sample/section/_sample_var.html"></div>
		</template>
