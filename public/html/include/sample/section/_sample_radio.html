<!-- 라디오 구역 — 같은 묶음은 같은 name -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">라디오</h2>
		<p class="section__desc">
			같은 묶음은 같은 name · 처음 선택은 data-attrs="checked" · 라벨 뒤 설명은 data-slot-extra
		</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="ui-choice-group ui-choice-group--column" role="radiogroup" aria-label="라디오 예시">
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_radio.html"
						data-id="sample_radio1"
						data-name="sample_radio"
						data-value="all"
						data-label="전체 공개"
						data-attrs="checked"
					></div>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_radio.html"
						data-id="sample_radio2"
						data-name="sample_radio"
						data-value="member"
						data-label="멤버 공개"
						data-slot-extra="#sample_radio2_desc"
					></div>
					<template id="sample_radio2_desc">
						<p class="ui-helper ui-helper--info">워크스페이스 멤버만 볼 수 있습니다.</p>
					</template>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_radio.html"
						data-id="sample_radio3"
						data-name="sample_radio"
						data-value="private"
						data-label="비공개 (비활성)"
						data-attrs="disabled"
					></div>
				</div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_radio.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_radio.html"
				readonly
				aria-label="라디오 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="ui-choice-group ui-choice-group--column" role="radiogroup" aria-label="라디오 예시">
				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_radio.html"
					data-id="sample_radio1"
					data-name="sample_radio"
					data-value="all"
					data-label="전체 공개"
					data-attrs="checked"
				></div>
				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_radio.html"
					data-id="sample_radio2"
					data-name="sample_radio"
					data-value="member"
					data-label="멤버 공개"
					data-slot-extra="#sample_radio2_desc"
				></div>
				<template id="sample_radio2_desc">
					<p class="ui-helper ui-helper--info">워크스페이스 멤버만 볼 수 있습니다.</p>
				</template>
				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_radio.html"
					data-id="sample_radio3"
					data-name="sample_radio"
					data-value="private"
					data-label="비공개 (비활성)"
					data-attrs="disabled"
				></div>
			</div>
		</div>
	</div>
</section>
<!--// 라디오 구역 -->
