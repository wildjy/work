<!-- 모달 구역 — 여는 버튼 + 모달 실체 + 슬롯 본문. 슬롯 template 은 include 를 적은 파일에 둔다는 규칙에 따라 여기 함께 둔다 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">모달</h2>
		<p class="section__desc">모달 프레임은 본문만 스크롤 · 확인창 · 버튼 없는 알림은 딤을 누르면 닫힘</p>
	</div>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="ui-btn-group">
				<button type="button" class="ui-btn ui-btn--contained" data-modal-open="sample_confirm">확인창 열기</button>
				<button type="button" class="ui-btn ui-btn--contained" data-modal-open="sample_invite">모달 열기</button>
				<button type="button" class="ui-btn ui-btn--outlined" data-modal-open="sample_alert">알림 모달 열기</button>
				<button type="button" class="ui-btn ui-btn--outlined" data-modal-open="sample_alert_detail">
					알림 모달(본문 슬롯) 열기
				</button>
			</div>
		</div>
	</div>
</section>
<div
	class="dynamic-content"
	data-source="/html/include/ui/_ui_modal.html"
	data-id="sample_invite"
	data-title="멤버 초대"
	data-subtext="초대할 멤버의 정보를 입력해주세요."
	data-slot-body="#sample_invite_body"
	data-confirm="초대하기"
></div>
<div
	class="dynamic-content"
	data-source="/html/include/ui/_ui_modal_alert.html"
	data-id="sample_alert"
	data-title="점검 안내"
	data-subtext="2026.09.20 02:00 ~ 06:00"
	data-text="서비스 점검 시간에는 로그인과 결제를 이용할 수 없습니다. 바깥 영역을 누르면 닫힙니다."
></div>
<div
	class="dynamic-content"
	data-source="/html/include/ui/_ui_modal_alert.html"
	data-id="sample_alert_detail"
	data-title="점검 상세"
	data-subtext="2026.09.20 02:00 ~ 06:00"
	data-slot-body="#sample_alert_detail_body"
></div>
<div
	class="dynamic-content"
	data-source="/html/include/ui/_ui_modal_confirm.html"
	data-id="sample_confirm"
	data-title="이벤트를 삭제하시겠습니까?"
	data-text="삭제한 이벤트는 복구할 수 없습니다."
	data-confirm="삭제"
></div>
<!--// 모달 구역 -->

<!-- 슬롯 본문 — 짧고 이 화면 전용이면 여기 직접(점검 상세), 길거나 여러 화면이 쓰면 include/sample/body/ 파셜로(멤버 초대) -->
<template id="sample_invite_body">
	<div class="dynamic-content" data-source="/html/include/sample/body/_sample_invite_body.html"></div>
</template>
<template id="sample_alert_detail_body">
	<p class="ui-modal__text">점검 시간에는 로그인 · 결제 · 알림 발송이 모두 멈춥니다.</p>
	<p class="ui-modal__text">점검 중 작성하던 내용은 저장되지 않으니 미리 저장해 주세요.</p>
	<p class="ui-modal__text">점검이 일찍 끝나면 공지사항으로 다시 안내합니다.</p>
</template>
<!--// 슬롯 본문 -->
