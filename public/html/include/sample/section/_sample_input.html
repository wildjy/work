<!-- 입력 구역 — 기본(라벨 옆 툴팁) · 오류 안내 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">입력</h2>
		<p class="section__desc">값을 넣으면 지우기 버튼 · 오류 안내문(helper)</p>
	</div>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="grid grid--2">
				<div>
					<div class="ui-label">
						<label for="sample_email">입력</label>
						<div
							class="dynamic-content"
							data-source="/html/include/ui/_ui_tooltip.html"
							data-id="tip_sample_email"
							data-position="right"
							data-text="로그인에 쓸 이메일입니다. 가입 후에는 바꿀 수 없습니다."
						></div>
					</div>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_input.html"
						data-id="sample_email"
						data-placeholder="이메일을 입력해주세요."
					></div>
				</div>
				<div>
					<label class="ui-label" for="sample_birth">입력 (오류 안내)</label>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_input.html"
						data-id="sample_birth"
						data-value="1999"
						data-modifier="is-error"
						data-helper="생년월일 8자리를 입력해주세요."
						data-helper-type="ui-helper--error"
					></div>
				</div>
			</div>
		</div>
	</div>
</section>
<!--// 입력 구역 -->
