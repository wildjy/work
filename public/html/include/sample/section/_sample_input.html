<!-- 입력 구역 — 기본(라벨 옆 툴팁) · 오류 안내 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">입력</h2>
		<p class="section__desc">값을 넣으면 지우기 버튼 · 오류 안내문(helper)</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="grid grid--2">
					<div>
						<div class="ui-label">
							<label for="sample_email">입력</label>
							<div
								class="dynamic-content"
								data-source="/html/include/ui/_ui_tooltip.html"
								data-id="tip_sample_email"
								data-position="right"
								data-text="로그인에 쓸 이메일입니다. 가입 후에는 바꿀 수 없습니다."
							></div>
						</div>
						<div
							class="dynamic-content"
							data-source="/html/include/ui/_ui_input.html"
							data-id="sample_email"
							data-placeholder="이메일을 입력해주세요."
						></div>
					</div>
					<div>
						<label class="ui-label" for="sample_birth">입력 (오류 안내)</label>
						<div
							class="dynamic-content"
							data-source="/html/include/ui/_ui_input.html"
							data-id="sample_birth"
							data-value="1999"
							data-modifier="is-error"
							data-helper="생년월일 8자리를 입력해주세요."
							data-helper-type="ui-helper--error"
						></div>
					</div>
				</div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_input.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_input.html"
				readonly
				aria-label="입력 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="grid grid--2">
				<div>
					<div class="ui-label">
						<label for="sample_email">입력</label>
						<div
							class="dynamic-content"
							data-source="/html/include/ui/_ui_tooltip.html"
							data-id="tip_sample_email"
							data-position="right"
							data-text="로그인에 쓸 이메일입니다. 가입 후에는 바꿀 수 없습니다."
						></div>
					</div>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_input.html"
						data-id="sample_email"
						data-placeholder="이메일을 입력해주세요."
					></div>
				</div>
				<div>
					<label class="ui-label" for="sample_birth">입력 (오류 안내)</label>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_input.html"
						data-id="sample_birth"
						data-value="1999"
						data-modifier="is-error"
						data-helper="생년월일 8자리를 입력해주세요."
						data-helper-type="ui-helper--error"
					></div>
				</div>
			</div>
		</div>
	</div>
</section>
<!--// 입력 구역 -->
