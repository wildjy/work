<!-- 버튼 구역 — ui-btn 변형 모음 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">버튼</h2>
		<p class="section__desc">contained · outlined · text · 작은 크기 · 비활성</p>
	</div>
	<details class="ui-card guide__src-fold">
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<textarea class="guide__src" data-raw readonly aria-label="소스 코드">
				<div class="ui-btn-group">
					<button type="button" class="ui-btn ui-btn--contained">저장</button>
					<button type="button" class="ui-btn ui-btn--outlined">임시 저장</button>
					<button type="button" class="ui-btn">취소</button>
					<button type="button" class="ui-btn ui-btn--contained ui-btn--sm">작은 버튼</button>
					<button type="button" class="ui-btn ui-btn--contained" disabled>비활성</button>
					<button type="button" class="ui-btn ui-btn--outlined" disabled>비활성</button>
				</div>
			</textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="ui-btn-group">
				<button type="button" class="ui-btn ui-btn--contained">저장</button>
				<button type="button" class="ui-btn ui-btn--outlined">임시 저장</button>
				<button type="button" class="ui-btn">취소</button>
				<button type="button" class="ui-btn ui-btn--contained ui-btn--sm">작은 버튼</button>
				<button type="button" class="ui-btn ui-btn--contained" disabled>비활성</button>
				<button type="button" class="ui-btn ui-btn--outlined" disabled>비활성</button>
			</div>
		</div>
	</div>
</section>
