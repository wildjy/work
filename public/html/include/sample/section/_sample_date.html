<!-- 날짜 · 기간 구역 — 이 파셜을 넣는 페이지는 jQuery · jQuery UI 를 불러야 한다 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">날짜 · 기간</h2>
		<p class="section__desc">jQuery UI datepicker — 입력을 누르면 달력이 열린다</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="grid grid--2">
					<div>
						<label class="ui-label" for="sample_period">기간</label>
						<div class="dynamic-content" data-source="/html/include/ui/_ui_period.html" data-id="sample_period"></div>
					</div>
					<div>
						<label class="ui-label" for="sample_date">날짜</label>
						<div class="dynamic-content" data-source="/html/include/ui/_ui_date.html" data-id="sample_date"></div>
					</div>
				</div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_date.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_date.html"
				readonly
				aria-label="날짜 입력 파셜 원문"
			></textarea>

			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_period.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_period.html"
				readonly
				aria-label="기간 입력 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="grid grid--2">
				<div>
					<label class="ui-label" for="sample_period">기간</label>
					<div class="dynamic-content" data-source="/html/include/ui/_ui_period.html" data-id="sample_period"></div>
				</div>
				<div>
					<label class="ui-label" for="sample_date">날짜</label>
					<div class="dynamic-content" data-source="/html/include/ui/_ui_date.html" data-id="sample_date"></div>
				</div>
			</div>
		</div>
	</div>
</section>
