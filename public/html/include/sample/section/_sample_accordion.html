<!-- 아코디언 구역 — 항목은 JSON · 0건 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">아코디언</h2>
		<p class="section__desc">항목은 JSON · 하나를 열면 나머지가 닫힌다(single) · 0건</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="grid grid--2">
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_accordion.html"
						data-items="/data/ui/sample_accordion.json"
					></div>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_accordion.html"
						data-items="/data/ui/empty.json"
					></div>
				</div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_accordion.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_accordion.html"
				readonly
				aria-label="아코디언 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="grid grid--2">
		<div
			class="dynamic-content"
			data-source="/html/include/ui/_ui_accordion.html"
			data-items="/data/ui/sample_accordion.json"
		></div>
		<div
			class="dynamic-content"
			data-source="/html/include/ui/_ui_accordion.html"
			data-items="/data/ui/empty.json"
		></div>
	</div>
</section>
<!--// 아코디언 구역 -->
