<!-- 토스트 구역 — 여는 버튼 + 토스트 실체(화면에 보이지 않는 덩어리도 여는 버튼과 같은 파셜에 둔다) -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">토스트</h2>
		<p class="section__desc">data-toast 로 띄운다 — 2.5초 뒤 저절로 숨는다</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="ui-btn-group">
					<button type="button" class="ui-btn ui-btn--outlined" data-toast="sample_toast">토스트 띄우기</button>
				</div>

				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_toast.html"
					data-id="sample_toast"
					data-text="저장되었습니다."
				></div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_toast.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_toast.html"
				readonly
				aria-label="토스트 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="ui-btn-group">
				<button type="button" class="ui-btn ui-btn--outlined" data-toast="sample_toast">토스트 띄우기</button>
			</div>
		</div>
	</div>
</section>
<div
	class="dynamic-content"
	data-source="/html/include/ui/_ui_toast.html"
	data-id="sample_toast"
	data-text="저장되었습니다."
></div>
<!--// 토스트 구역 -->
