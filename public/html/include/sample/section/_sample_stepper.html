<!-- 수량 스테퍼 구역 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">수량 스테퍼</h2>
		<p class="section__desc">최소 1 · 최대 3 — 경계에 닿으면 버튼이 비활성</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="grid grid--2">
					<div>
						<label class="ui-label" for="sample_count">수량 스테퍼</label>
						<div
							class="dynamic-content"
							data-source="/html/include/ui/_ui_stepper.html"
							data-id="sample_count"
							data-value="1"
							data-min="1"
							data-max="3"
						></div>
					</div>
				</div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_stepper.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_stepper.html"
				readonly
				aria-label="수량 스테퍼 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="grid grid--2">
				<div>
					<label class="ui-label" for="sample_count">수량 스테퍼</label>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_stepper.html"
						data-id="sample_count"
						data-value="1"
						data-min="1"
						data-max="3"
					></div>
				</div>
			</div>
		</div>
	</div>
</section>
<!--// 수량 스테퍼 구역 -->
