<!-- 토글 구역 — 누르는 즉시 반영되는 설정 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">토글</h2>
		<p class="section__desc">누르는 즉시 반영되는 설정에 쓴다 — 저장 버튼이 있으면 체크박스</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<div class="ui-choice-group ui-choice-group--column" role="group" aria-label="토글 예시">
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_toggle.html"
						data-id="sample_toggle1"
						data-label="알림 받기"
					></div>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_toggle.html"
						data-id="sample_toggle2"
						data-label="자동 저장"
						data-attrs="checked"
					></div>
					<div
						class="dynamic-content"
						data-source="/html/include/ui/_ui_toggle.html"
						data-id="sample_toggle3"
						data-label="베타 기능 (비활성)"
						data-attrs="disabled"
					></div>
				</div>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/ui/_ui_toggle.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/ui/_ui_toggle.html"
				readonly
				aria-label="토글 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body">
			<div class="ui-choice-group ui-choice-group--column" role="group" aria-label="토글 예시">
				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_toggle.html"
					data-id="sample_toggle1"
					data-label="알림 받기"
				></div>
				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_toggle.html"
					data-id="sample_toggle2"
					data-label="자동 저장"
					data-attrs="checked"
				></div>
				<div
					class="dynamic-content"
					data-source="/html/include/ui/_ui_toggle.html"
					data-id="sample_toggle3"
					data-label="베타 기능 (비활성)"
					data-attrs="disabled"
				></div>
			</div>
		</div>
	</div>
</section>
<!--// 토글 구역 -->
