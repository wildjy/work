<!-- 파셜 변수 구역 — 기본값이 쓰이는 헤더 · 개발단이 채울 자리 표시 -->
<section class="section">
	<div class="section__head">
		<h2 class="section__title">파셜 기본값 · 개발단 표시</h2>
		<p class="section__desc">data-page-title 을 넘기지 않은 헤더 · 개발단이 채울 값</p>
	</div>
	<details class="ui-card guide__src-fold" open>
		<summary class="ui-card__header"><h3 class="ui-card__title">소스 코드</h3></summary>
		<div class="ui-card__body">
			<p class="guide__src-path">부르는 쪽 — 페이지에 적는 줄</p>
			<textarea class="guide__src" data-raw readonly aria-label="부르는 쪽 소스 코드">
				<!-- 파셜 : 기본값 사용 (data-page-title 을 넘기지 않음) -->
				<div class="dynamic-content" data-source="/html/include/common/_header.html"></div>

				<!--@ 이메일 인증 전 회원에게만 노출 -->
				<p>인증 대기 {{<em>3명</em>}}</p>
			</textarea>

			<!--@ 아래 칸은 파셜 파일을 그대로 읽어 온다(data-src-file) — 파셜을 고치면 여기도 따라 바뀐다 -->
			<p class="guide__src-path">펼친 마크업 — /html/include/common/_header.html</p>
			<textarea
				class="guide__src"
				data-src-file="/html/include/common/_header.html"
				readonly
				aria-label="공통 헤더 파셜 원문"
			></textarea>
		</div>
	</details>
	<div class="ui-card">
		<div class="ui-card__body ui-card__body--flush">
			<!-- 파셜 : 기본값 사용 (data-page-title 을 넘기지 않음) -->
			<div class="dynamic-content" data-source="/html/include/common/_header.html"></div>
		</div>
		<div class="ui-card__body">
			<!--@ 이메일 인증 전 회원에게만 노출 -->
			<p>인증 대기 {{<em>3명</em>}}</p>
		</div>
	</div>
</section>
<!--// 파셜 변수 구역 -->
