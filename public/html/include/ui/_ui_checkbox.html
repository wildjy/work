<!-- 공통 체크박스 — 받는 값 : data-id(필수) · data-label(필수) · data-name · data-value · data-attrs(checked · disabled) · data-modifier -->
<label class="ui-checkbox {{modifier|}}">
	<input type="checkbox" class="ui-checkbox__input" id="{{id}}" name="{{name|}}" value="{{value|}}" {{{attrs|}}} />
	<span class="ui-checkbox__box"></span>
	<span class="ui-checkbox__label">{{label}}</span>
</label>
