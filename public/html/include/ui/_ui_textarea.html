<!-- 26.09.30 : 공통 여러 줄 입력 — 필드(입력칸 + 글자 수 + 안내문) 한 세트
     받는 값 : data-id(필수) · data-name · data-value(입력된 내용)
               data-placeholder(기본 내용을 입력해주세요.) — 원문 · 큰따옴표는 넣지 않는다
               data-cls — 입력칸 class 전체(기본 ui-textarea) : ui-textarea is-error · ui-textarea is-disabled
               data-box-cls — 필드 class 전체(기본 ui-field)
               data-attrs — 입력에 더할 속성(원문) : disabled · readonly · maxlength=&quot;1000&quot;
               data-count(기본 0) · data-max(기본 1000) — 글자 수 표시
               data-slot-helper — 안내문 template : p 태그 ui-helper(--error · --success · --info)
     ⚠ 슬롯 · attrs 줄은 넘기지 않으면 프리렌더가 그 줄을 지운다 — 줄에 혼자 둔다. 그래서 이 파일은 prettier 가 정렬하지 않는다(.prettierignore).
     ⚠ 닫는 > 와 내용 사이에 줄바꿈을 두지 않는다 — textarea 안의 공백은 값이 된다. -->
<div class="{{boxCls|ui-field}}">
	<div class="{{cls|ui-textarea}}">
		<textarea
			id="{{id}}"
			name="{{name|}}"
			{{{attrs|}}}
			placeholder="{{{placeholder|내용을 입력해주세요.}}}"
		>{{value|}}</textarea>
	</div>
	<!--@ 글자 수는 입력할 때 개발단이 채운다 -->
	<p class="ui-textarea__count"><strong>{{count|0}}</strong> / {{max|1000}}</p>
	{{{helper|}}}
</div>
