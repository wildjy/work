<!-- 공통 LNB — 메뉴는 이 파일에서 고친다 -->
<!--@ 현재 페이지 메뉴의 is-active 와 상위 메뉴의 is-open 은 common.js 의 lnbActive 가 붙인다 -->
<!--@ 사용법 문서를 열면 현재 페이지 항목 아래에 그 페이지의 목차(.ui-lnb__toc)가 붙는다 — common.js 의 lnbTocBuild 가 절 제목을 읽어 만든다(여기 적지 않는다) -->
<nav class="ui-lnb">
	<div class="ui-lnb__menu">
		<ul class="ui-lnb__group">
			<li class="ui-lnb__item">
				<a class="ui-lnb__link" href="/index.html">작업 목록</a>
			</li>
			<li class="ui-lnb__item">
				<button type="button" class="ui-lnb__link ui-lnb__link--toggle" aria-expanded="false">사용법</button>
				<div class="ui-lnb__sub" hidden>
					<ul class="ui-lnb__group">
						<li class="ui-lnb__item">
							<a class="ui-lnb__link" href="/html/guide/Guide_Structure.html">폴더 구조</a>
						</li>
						<li class="ui-lnb__item">
							<a class="ui-lnb__link" href="/html/guide/Guide_Partial.html">파셜(include)</a>
						</li>
					</ul>
				</div>
			</li>
			<li class="ui-lnb__item">
				<button type="button" class="ui-lnb__link ui-lnb__link--toggle" aria-expanded="false">개발 확인용</button>
				<div class="ui-lnb__sub" hidden>
					<!--@ 개발 확인용 페이지 목록은 /data/common/lnb_dev.json 에서 고친다 -->
					<ul
						class="ui-lnb__group dynamic-list"
						data-source="/data/common/lnb_dev.json"
						data-template="#tpl_lnb_dev"
						data-empty="#tpl_lnb_dev_none"
					></ul>
				</div>
			</li>
		</ul>
	</div>
</nav>
<!-- 목록 템플릿 (listRender.js 가 JSON 을 순회해 렌더) -->
<template id="tpl_lnb_dev">
	<li class="ui-lnb__item">
		<a class="ui-lnb__link" href="{{href}}">{{title}}</a>
	</li>
</template>
<template id="tpl_lnb_dev_none">
	<li class="ui-lnb__item">
		<p class="ui-lnb__empty">등록된 페이지가 없습니다.</p>
	</li>
</template>
<!--// 목록 템플릿 -->
