<!-- 공통 모달 기본 버튼 — 받는 값 : data-cancel · data-confirm (_ui_modal 이 넘긴다) -->
<!-- 버튼 구성이 다르면 버튼 파셜을 따로 만들어 _ui_modal 의 data-footer 로 넘긴다 -->
<button type="button" class="ui-btn ui-btn--outlined" data-modal-close>{{cancel|취소}}</button>
<!--@ 확인 동작은 개발 연동 — 처리 후 닫는다 -->
<button type="button" class="ui-btn ui-btn--contained">{{confirm|확인}}</button>
