<!-- 공통 라디오 — 받는 값 : data-id(필수) · data-name(필수 · 같은 묶음은 같은 이름) · data-label(필수) · data-value · data-attrs(checked · disabled) · data-modifier -->
<label class="ui-radio {{modifier|}}">
	<input type="radio" class="ui-radio__input" id="{{id}}" name="{{name}}" value="{{value|}}" {{{attrs|}}} />
	<span class="ui-radio__box"></span>
	<span class="ui-radio__label">{{label}}</span>
</label>
