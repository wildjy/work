<!-- 26.09.30 : 공통 라디오
     받는 값 : data-id(필수) · data-name(필수 · 같은 묶음은 같은 이름) · data-label(필수 · 원문) · data-value
               data-cls — class 전체(기본 ui-radio) : ui-radio is-disabled 등
               data-attrs — 입력에 더할 속성(원문) : checked · disabled · onchange=&quot;…&quot;
               data-slot-extra — 라벨 뒤에 붙는 것 template(라벨 밖) : 설명 · 기타 사유 입력
     ⚠ 슬롯 · attrs 줄은 넘기지 않으면 프리렌더가 그 줄을 지운다 — 줄에 혼자 둔다. 그래서 이 파일은 prettier 가 정렬하지 않는다(.prettierignore).
     ⚠ 라벨(label 태그) 안에는 입력을 하나만 둔다 — 그래서 extra 는 라벨 밖, 바로 뒤에 붙는다. -->
<label class="{{cls|ui-radio}}">
	<input
		type="radio"
		class="ui-radio__input"
		id="{{id}}"
		name="{{name}}"
		{{{attrs|}}}
		value="{{value|}}"
	/>
	<span class="ui-radio__box"></span>
	<span class="ui-radio__label">{{{label}}}</span>
</label>
{{{extra|}}}
