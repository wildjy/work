<!-- 공통 확인창 — 받는 값 : data-id(필수) · data-title(필수) · data-text · data-confirm · data-cancel · data-modifier -->
<!--@ 열기 : data-modal-open="아이디" 버튼 또는 modalOpen('아이디') -->
<div
	class="ui-modal {{modifier|ui-modal--sm}}"
	id="{{id}}"
	role="dialog"
	aria-modal="true"
	aria-labelledby="{{id}}_title"
	hidden
>
	<div class="ui-modal__dialog">
		<div class="ui-modal__header">
			<h2 class="ui-modal__title" id="{{id}}_title">{{title}}</h2>
		</div>
		<div class="ui-modal__body">
			<p class="ui-modal__text">{{text|}}</p>
		</div>
		<div class="ui-modal__footer">
			<button type="button" class="ui-modal__cancel" data-modal-close>{{cancel|취소}}</button>
			<!--@ 확인 동작은 개발 연동 — 처리 후 닫는다 -->
			<button type="button" class="ui-modal__confirm" data-modal-close>{{confirm|확인}}</button>
		</div>
		<button type="button" class="ui-modal__close">닫기</button>
	</div>
</div>
