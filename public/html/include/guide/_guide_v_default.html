<!-- 사용법 문서 전용 데모 — 3-2 기본값. 안 넘기면 무엇이 들어오나.
     받는 값 : data-btn(기본값 있음) · data-memo(기본값 없음 — 안 넘기면 중괄호가 그대로 보인다)
     ⚠ 이 파일의 마크업은 _guide_partial_*.html 코드 예시(코드 칸)에 그대로 실려 있다 — 고치면 그쪽도 같이 고친다. -->
<table class="ui-table ui-table--wrap">
	<caption class="guide__caption">
		기본값 결과
	</caption>
	<tbody>
		<tr>
			<td class="guide__term">기본값 있는 키 — btn</td>
			<td><button type="button" class="ui-btn ui-btn--sm ui-btn--outlined">{{btn|저장하기}}</button></td>
		</tr>
		<tr>
			<td class="guide__term">기본값 없는 키 — memo</td>
			<td>{{memo}}</td>
		</tr>
	</tbody>
</table>
