<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>[개발 확인용] 공통 UI · 파셜 · 목록 샘플</title>
		<link rel="stylesheet" href="../css/common.css" />
		<script src="../js/dynamicImport.js"></script>
		<script src="../js/listRender.js"></script>
		<script src="../js/common.js"></script>
		<!-- 날짜 · 기간 달력용 -->
		<script src="../js/jquery-3.7.1.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
	</head>

	<body>
		<div class="layout">
			<!-- 사이드 : 브랜드 + LNB -->
			<aside class="layout__side">
				<p class="layout__brand">pub-base</p>
				<div class="dynamic-content" data-source="./include/ui/_ui_lnb.html"></div>
			</aside>

			<div class="layout__body">
				<!-- 파셜 include + 파셜 변수 (data-page-title → {{pageTitle}}) -->
				<div class="dynamic-content" data-source="./include/common/_header.html" data-page-title="공통 UI 샘플"></div>

				<main class="layout__main">
					<div class="dynamic-content" data-source="./include/sample/section/_sample_list.html"></div>

					<div class="dynamic-content" data-source="./include/sample/section/_sample_button.html"></div>

					<div class="dynamic-content" data-source="./include/sample/section/_sample_input.html"></div>

					<div class="dynamic-content" data-source="./include/sample/section/_sample_choice.html"></div>

					<div class="dynamic-content" data-source="./include/sample/section/_sample_nav.html"></div>

					<div class="dynamic-content" data-source="./include/sample/section/_sample_feedback.html"></div>

					<div class="dynamic-content" data-source="./include/sample/section/_sample_var.html"></div>
				</main>
			</div>
		</div>

		<div class="dynamic-content" data-source="./include/sample/section/_sample_overlay.html"></div>
	</body>
</html>
