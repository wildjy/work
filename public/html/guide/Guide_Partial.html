<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>파셜(include) 사용법</title>
		<link rel="stylesheet" href="/css/common.css" />
		<script src="/js/dynamicImport.js"></script>
		<script src="/js/listRender.js"></script>
		<script src="/js/common.js"></script>
	</head>

	<body>
		<div class="layout">
			<!-- 사이드 : 브랜드 + LNB -->
			<aside class="layout__side">
				<p class="layout__brand">pub-base</p>
				<div class="dynamic-content" data-source="/html/include/ui/_ui_lnb.html"></div>
			</aside>

			<div class="layout__body">
				<div
					class="dynamic-content"
					data-source="/html/include/common/_header.html"
					data-page-title="파셜(include) 사용법"
				></div>

				<main class="layout__main guide">
					<!-- 구역 : 목차 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_toc.html"></div>
					<!--// 구역 : 목차 -->

					<!-- 구역 : 기본형 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_basic.html"></div>
					<!--// 구역 : 기본형 -->

					<!-- 구역 : 동작 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_flow.html"></div>
					<!--// 구역 : 동작 -->

					<!-- 구역 : 부르는 쪽 규칙 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_call.html"></div>
					<!--// 구역 : 부르는 쪽 규칙 -->

					<!-- 구역 : 값 넘기기 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_vars.html"></div>
					<!--// 구역 : 값 넘기기 -->

					<!-- 구역 : 경로 변수 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_optional.html"></div>
					<!--// 구역 : 경로 변수 -->

					<!-- 구역 : 슬롯 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_slot.html"></div>
					<!--// 구역 : 슬롯 -->

					<!-- 구역 : 파셜과 목록 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_list.html"></div>
					<!--// 구역 : 파셜과 목록 -->

					<!-- 구역 : 사다리 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_ladder.html"></div>
					<!--// 구역 : 사다리 -->

					<!-- 구역 : React 대응 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_react.html"></div>
					<!--// 구역 : React 대응 -->

					<!-- 구역 : 새로 만들 때 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_new.html"></div>
					<!--// 구역 : 새로 만들 때 -->

					<!-- 구역 : 함정 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_trap.html"></div>
					<!--// 구역 : 함정 -->

					<!-- 구역 : 증상 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_symptom.html"></div>
					<!--// 구역 : 증상 -->

					<!-- 구역 : 예시 모음 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_sample.html"></div>
					<!--// 구역 : 예시 모음 -->

					<!-- 구역 : 마무리 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_partial_finish.html"></div>
					<!--// 구역 : 마무리 -->
				</main>
			</div>
		</div>

		<!-- 목록 템플릿 (listRender.js 가 JSON 을 순회해 렌더) -->
		<template id="tpl_guide_rule">
			<tr>
				<td class="guide__term">{{{term}}}</td>
				<td>{{{desc}}}</td>
			</tr>
		</template>
		<template id="tpl_guide_rule_none">
			<tr>
				<td colspan="2" class="ui-table__empty">등록된 규칙이 없습니다.</td>
			</tr>
		</template>
		<!--// 목록 템플릿 -->
	</body>
</html>
