<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>폴더 구조 — 어느 폴더에 두나</title>
		<link rel="stylesheet" href="/css/common.css" />
		<script src="/js/dynamicImport.js"></script>
		<script src="/js/listRender.js"></script>
		<script src="/js/common.js"></script>
	</head>

	<body>
		<div class="layout">
			<!-- 사이드 : 브랜드 + LNB -->
			<aside class="layout__side">
				<p class="layout__brand">pub-base</p>
				<div class="dynamic-content" data-source="/html/include/ui/_ui_lnb.html"></div>
			</aside>

			<div class="layout__body">
				<div
					class="dynamic-content"
					data-source="/html/include/common/_header.html"
					data-page-title="폴더 구조 — 어느 폴더에 두나"
				></div>

				<main class="layout__main guide">
					<!-- 구역 : 목차 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_toc.html"></div>
					<!--// 구역 : 목차 -->

					<!-- 구역 : FSD -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_fsd.html"></div>
					<!--// 구역 : FSD -->

					<!-- 구역 : 세그먼트 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_segment.html"></div>
					<!--// 구역 : 세그먼트 -->

					<!-- 구역 : 이름 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_naming.html"></div>
					<!--// 구역 : 이름 -->

					<!-- 구역 : 언제 빼나 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_when.html"></div>
					<!--// 구역 : 언제 빼나 -->

					<!-- 구역 : 의존 방향 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_dep.html"></div>
					<!--// 구역 : 의존 방향 -->

					<!-- 구역 : 적용 실물 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_now.html"></div>
					<!--// 구역 : 적용 실물 -->

					<!-- 구역 : 더 나아가려면 -->
					<div class="dynamic-content" data-source="/html/include/guide/section/_guide_structure_next.html"></div>
					<!--// 구역 : 더 나아가려면 -->
				</main>
			</div>
		</div>

		<!-- 목록 템플릿 (listRender.js 가 JSON 을 순회해 렌더) -->
		<template id="tpl_structure_row">
			<tr>
				<td class="guide__term">{{{term}}}</td>
				<td>{{{desc}}}</td>
			</tr>
		</template>
		<template id="tpl_structure_row_none">
			<tr>
				<td colspan="2" class="ui-table__empty">등록된 내용이 없습니다.</td>
			</tr>
		</template>
		<!--// 목록 템플릿 -->
	</body>
</html>
