# GitHub Pages 배포 — public/ 을 사이트 루트로 올린다
#   Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 둬야 동작한다.
#   주소 : https://wildjy.github.io/work/  (작업 목록) · /prerender/<페이지>.html
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # 산출물이 원본과 어긋난 채 배포되는 것을 막는다 (커밋 훅과 같은 검사)
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prerender
      - name: 프리렌더 산출물이 최신인지 확인
        run: git diff --exit-code --ignore-cr-at-eol public/prerender
      - run: npm run validate

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deploy
        uses: actions/deploy-pages@v4
