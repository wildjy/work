# GitHub Pages 배포 — public/ 을 사이트 루트로 올린다
#   Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 둬야 동작한다.
#   주소 : https://wildjy.github.io/work/  (작업 목록) · /prerender/<페이지>.html
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # 산출물이 원본과 어긋난 채 배포되는 것을 막는다 (커밋 훅과 같은 검사)
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prerender
      - name: 프리렌더 산출물이 최신인지 확인
        run: git diff --exit-code --ignore-cr-at-eol public/prerender
      - run: npm run validate

      - id: pages
        uses: actions/configure-pages@v5
      # 경로가 사이트 루트(/css/ …) 기준이라 프로젝트 사이트(/work/)에서는 그대로 404 가 난다.
      # 복사본(_site)에만 base 를 붙인다 — 원본·커밋된 산출물은 로컬(localhost:3500) 기준 그대로다.
      - name: 경로에 base 붙이기
        run: npm run pages -- --base "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deploy
        uses: actions/deploy-pages@v4
